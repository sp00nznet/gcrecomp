name: CI

on:
  push:
    branches: [main, "issue-*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: Windows (MSVC)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libasound2-dev libgl-dev

      # The generated game code is not built here (it needs a disc); this builds the runtime libraries,
      # the GP renderer (SDL3 fetched and built from source), the recompiler tools and the unit tests.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGCRECOMP_FETCH_SDL3=ON -DGCRECOMP_BUILD_TESTS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DGCRECOMP_FETCH_SDL3=ON -DGCRECOMP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
